version: "2"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet checks (shadow, printf, etc.)
    - ineffassign    # assigned but never used
    - staticcheck    # comprehensive static analysis (includes gosimple + unused)
    - misspell       # common spelling mistakes
    - godot          # comment punctuation
    - nilerr         # return nil instead of err
    - exhaustive     # exhaustive switch on enums
    - gosec          # security checks (integer conversions, file modes, subprocesses, crypto)
  settings:
    exhaustive:
      default-signifies-exhaustive: true  # a default: case satisfies exhaustiveness
  exclusions:
    rules:
      # The one justified exception (.otfabric/exceptions.yaml, GO-014):
      # IEEE 1815-2012 7.6.1.1.1 requires every device to implement
      # HMAC-SHA-1 and to let configuration disable it, so secauth imports
      # crypto/sha1 (disabled through secauth.User.MAC on the outstation and
      # client.WithChallengeMACs on the master).
      - path: secauth/secauth\.go
        linters:
          - gosec
        text: "G505:"

formatters:
  enable:
    - gofmt          # formatting
    - goimports      # import grouping / formatting

  exclusions:
    paths:
      - examples

issues:
  # Bump the default per-linter issue limit (default is 50)
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  # Include the //go:build interop package so that it is linted by
  # make lint-ci / make check, not only compiled by make interop.
  build-tags:
    - interop