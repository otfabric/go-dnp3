# dnp3c configuration of the go-dnp3 conformance outstation (this
# directory). Options left out have dnp3c's defaults (dnp3c -write lists them
# all). Each value here is the outstation's Device Profile: keep it in step
# with device.go. run.sh sets outstation.subset.level, the address the
# runner reaches the outstation at, and, for level 3 and for 2.7, the frozen
# counter events and the double-bit inputs.

test.output.directory = ./results
test.deviceUnderTest = go-dnp3 conformance outstation
outstation.subset.level = 2

# Where the outstation listens; dnp3c is master 1, the outstation 1024.
tcp.device.address = 127.0.0.1
tcp.device.port = 20000
link.source = 1
link.destination = 1024

# Confirm timeout of solicited and unsolicited responses (5 s).
outstation.app.confirm.timeout.ms = 5000
unsolicited.unsolicitedConfirmTimeoutMs = 5000

# Points: indices 0..3 of every type the subset level has, and binary inputs
# 4..6 in classes 2, 2 and 3 for Assign Class. No double-bit inputs: dnp3c
# has their objects at level 4.
binaryOutput.installedPoints = 0 ... 3
analogOutput.installedPoints = 0 ... 3
supports.doubleBitInput = false
binaryInput.eventsClass = 1
counter.eventsClass = 3
analogInput.eventsClass = 2
binaryInput.defaultEventVariation = 2
class.assign.class1BinaryInputs = 0
class.assign.class2BinaryInputs = 4, 5
class.assign.class3BinaryInputs = 6
# Frozen counter events (g23) are level 3 objects.
supports.frozenCounterChangeEvents = false
analogInput.valueReturn.deadband = 1
event.buffer.maxBinaryInputEvents = 100
event.buffer.maxAnalogInputEvents = 100
event.buffer.maxCounterEvents = 100

# Controls: two per request; analog outputs take 32-bit commands but hold
# 16-bit values.
binaryOutput.maxPointsInSingleRequest = 2
analogOutput.maxPointsInSingleRequest = 2
analogOutput.commands32Bit = true

# Time: IIN1.4 every 10 s (server.WithTimeSync), unsynchronized 20 s after the
# last synchronization.
timesync.maxTimeBetweenSyncRequestsMs = 10000
timesync.timeToUnsynchronizedMs = 20000

# Device attributes of set 0 the outstation reports (dut's attributes).
attributes.supportedVariations = 242, 243, 245, 246, 247, 248, 250, 252
