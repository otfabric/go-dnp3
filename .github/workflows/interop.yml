name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma dnp3 reference image (default: the pinned release)"
        required: false
      nfmdnp3_image:
        description: "nfm-dnp3 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # This job has Docker: a missing Docker fails the suite, it does not skip it.
  DNP3_REQUIRE_INTEROP: "1"
  # otfabric/dnp3-interop v0.12.0: opendnp3 3.1.2, DSC go-dnp3 v0.8.2,
  # dnp3py 0.6.0, cB-Sigma dnp3 v0.3.1, nfm-dnp3 1.0.1.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:f53239c73d972fac0ea62427098b86a2a164cf8fa584ea7f3f334e9043617847' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:58e8a65145f9f484a5f89bebec3262039857acc8925f8af53663299019a22e5f' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:0bc9913362efd7fbffbe0f3b12b53e0029b56080678d45b6b13b57558d72d000' }}
  DNP3_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/dnp3-interop-cbsigma@sha256:930cc02e9d8d231ddc4dc81e6fe19df7f2b43eaf8267fc6bf4cf9d53ff40dc48' }}
  DNP3_INTEROP_NFMDNP3_IMAGE: ${{ inputs.nfmdnp3_image || 'ghcr.io/otfabric/dnp3-interop-nfmdnp3@sha256:a863002401cdadb6c6bdffec97bf85ae9824ca45ab483b67d88d6d75d0de1e72' }}

jobs:
  interop:
    name: opendnp3 + dscsystems + dnp3py + cbsigma + nfmdnp3, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"
          docker pull "$DNP3_INTEROP_CBSIGMA_IMAGE"
          docker pull "$DNP3_INTEROP_NFMDNP3_IMAGE"

      - name: Interop tests
        run: make test-interop
