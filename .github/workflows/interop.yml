name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      stepfunc_image:
        description: "stepfunc dnp3 reference image (default: the pinned release)"
        required: false
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/dnp3-interop v0.6.0: stepfunc dnp3 1.8.0, opendnp3 3.1.2,
  # DSC go-dnp3 v0.8.2, dnp3py 0.6.0.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_STEPFUNC_IMAGE: ${{ inputs.stepfunc_image || 'dnp3-interop-stepfunc:v0.6.0' }}
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:a637998c28c60e6dcaaab51572fdf77e4290ce4e2939483a753a6ac0acd68cd2' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:ec0f25dfdcdbda12de259b6481d66e248da29ea817874f5f727b8a052fba8624' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:68bdf9637da43d16e1e76603fbf0fa32adb71c2d8b078c35ef7f29f2288455dc' }}

jobs:
  interop:
    name: stepfunc + opendnp3 + dscsystems + dnp3py, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"

      # The stepfunc image is not published (Step Function I/O's licence
      # does not allow redistributing its library): it is built here from
      # dnp3-interop's source, unless an image is given.
      - name: Build the stepfunc reference image
        run: make interop-stepfunc

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"

      - name: Interop tests
        run: make test-interop
