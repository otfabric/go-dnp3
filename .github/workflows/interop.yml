name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      stepfunc_image:
        description: "stepfunc dnp3 reference image (default: the pinned release)"
        required: false
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC Systems go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/dnp3-interop v0.2.0: stepfunc dnp3 1.7.0, opendnp3 3.1.2,
  # DSC Systems go-dnp3 v0.8.1, dnp3py 0.6.0.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_STEPFUNC_IMAGE: ${{ inputs.stepfunc_image || 'ghcr.io/otfabric/dnp3-interop-stepfunc@sha256:ead1ea3c9a0f48ea363f745846ff2d5df8f077f50b6bb7f20914c3207ba5667e' }}
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:a69ebb5962b334ff9813a1efbb871ccd5d296fad71bd13feb94bec52ef7ff19a' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:d0576cceabf24cbd072b672069226c30486aa84046dc98d813a5427a32dbae3a' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:14598aebcd5698d8f342d6d9beaa98b8618d724c57fbbe34222737678ceff0ef' }}

jobs:
  interop:
    name: stepfunc + opendnp3 + dscsystems + dnp3py, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_STEPFUNC_IMAGE"
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"

      - name: Interop tests
        run: make test-interop
