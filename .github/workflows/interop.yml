name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # This job has Docker: a missing Docker fails the suite, it does not skip it.
  DNP3_REQUIRE_INTEROP: "1"
  # otfabric/dnp3-interop v0.8.0: opendnp3 3.1.2, DSC go-dnp3 v0.8.2,
  # dnp3py 0.6.0.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:2ce7bf8bbc1714f49d27889defac6bef64dff28a8d2cd9be3d282344ed865b6d' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:df79c30786282a84626b76c4d1d6c348cba45d5d53a697e40ddf1ca3cdb71677' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:bc8349e8f7a1dd6f31ee66a5e4d90e262658dbfa7dc651a8480c9188d4a4099e' }}

jobs:
  interop:
    name: opendnp3 + dscsystems + dnp3py, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"

      - name: Interop tests
        run: make test-interop
