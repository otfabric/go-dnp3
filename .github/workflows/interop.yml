name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma dnp3 reference image (default: the pinned release)"
        required: false
      nfmdnp3_image:
        description: "nfm-dnp3 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # This job has Docker: a missing Docker fails the suite, it does not skip it.
  DNP3_REQUIRE_INTEROP: "1"
  # otfabric/dnp3-interop v0.11.2: opendnp3 3.1.2, DSC go-dnp3 v0.8.2,
  # dnp3py 0.6.0, cB-Sigma dnp3 v0.3.0, nfm-dnp3 1.0.1.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:76a2baa2da118e049196d2b7310f84cc79b38ddf0443a40e410e4553f4773203' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:768f85690f97fcf800d56f5862450365264f1021f675dd6a9ed5c581ec449134' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:af83c625c14f0897805573166bdd610ee35e7ba818986ed2107f525f73b4f159' }}
  DNP3_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/dnp3-interop-cbsigma@sha256:61a43fc0cb99c5f8987484fd983c302d4815702b31891ddfa1f29c7bc4876cb4' }}
  DNP3_INTEROP_NFMDNP3_IMAGE: ${{ inputs.nfmdnp3_image || 'ghcr.io/otfabric/dnp3-interop-nfmdnp3@sha256:9345804a876c9e1795fc099a724ca0e3e5c5f6deebbbf47113056413b2155bed' }}

jobs:
  interop:
    name: opendnp3 + dscsystems + dnp3py + cbsigma + nfmdnp3, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"
          docker pull "$DNP3_INTEROP_CBSIGMA_IMAGE"
          docker pull "$DNP3_INTEROP_NFMDNP3_IMAGE"

      - name: Interop tests
        run: make test-interop
