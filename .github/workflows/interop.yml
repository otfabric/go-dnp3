name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # This job has Docker: a missing Docker fails the suite, it does not skip it.
  DNP3_REQUIRE_INTEROP: "1"
  # otfabric/dnp3-interop v0.10.0: opendnp3 3.1.2, DSC go-dnp3 v0.8.2,
  # dnp3py 0.6.0.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:e4615455c017ceb22559e080e900f96becf25797033bb4b13526f7a1aaaad2f2' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:d351a7854238960fedf815b9245b2a2bce87b0354204f29bde0c9b963ab77f5c' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:6630a6433357e450b6340b83c1c6ffe535c762f2e0d6af6c0cdd97a020e704eb' }}

jobs:
  interop:
    name: opendnp3 + dscsystems + dnp3py, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"

      - name: Interop tests
        run: make test-interop
