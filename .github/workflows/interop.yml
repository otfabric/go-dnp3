# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-dnp3 against the reference implementations published by
# otfabric/dnp3-interop, as master and as outstation. The images are consumed
# as published: nothing of dnp3-interop is cloned or built here.

on:
  workflow_call:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        type: string
        default: ""
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        type: string
        default: ""
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        type: string
        default: ""
      cbsigma_image:
        description: "cB-Sigma dnp3 reference image (default: the pinned release)"
        type: string
        default: ""
      nfmdnp3_image:
        description: "nfm-dnp3 reference image (default: the pinned release)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      opendnp3_image:
        description: "opendnp3 reference image (default: the pinned release)"
        required: false
      dscsystems_image:
        description: "DSC go-dnp3 reference image (default: the pinned release)"
        required: false
      dnp3py_image:
        description: "dnp3py reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma dnp3 reference image (default: the pinned release)"
        required: false
      nfmdnp3_image:
        description: "nfm-dnp3 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # This job has Docker: a missing Docker fails the suite, it does not skip it.
  DNP3_REQUIRE_INTEROP: "1"
  # otfabric/dnp3-interop v0.12.3: opendnp3 3.1.2, DSC go-dnp3 v0.8.2,
  # dnp3py 0.6.0, cB-Sigma dnp3 v0.3.2, nfm-dnp3 1.0.1.
  # Keep in step with the Makefile and interop/harness.go.
  DNP3_INTEROP_OPENDNP3_IMAGE: ${{ inputs.opendnp3_image || 'ghcr.io/otfabric/dnp3-interop-opendnp3@sha256:1e1f576aca65e0d35f92a6e1e7b1a0e44ec66fcac3edbbfe850f8af43f4145e0' }}
  DNP3_INTEROP_DSCSYSTEMS_IMAGE: ${{ inputs.dscsystems_image || 'ghcr.io/otfabric/dnp3-interop-dscsystems@sha256:60bf1a3463968979237356dbfa923003d29cda5651b9bcc6256bed600875f12b' }}
  DNP3_INTEROP_DNP3PY_IMAGE: ${{ inputs.dnp3py_image || 'ghcr.io/otfabric/dnp3-interop-dnp3py@sha256:647a144c87b3c04f5affaf58a501fdfe0711138744055331c79a0228783b7f0d' }}
  DNP3_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/dnp3-interop-cbsigma@sha256:8688e2d089649413afc813114422a3b97fc163c3ce16cde4e17eabf34663962e' }}
  DNP3_INTEROP_NFMDNP3_IMAGE: ${{ inputs.nfmdnp3_image || 'ghcr.io/otfabric/dnp3-interop-nfmdnp3@sha256:c30e3e6d640494d95ecdd1540c679ab389607d0413627d3aab4382fbb41cf68d' }}

jobs:
  interop:
    name: opendnp3 + dscsystems + dnp3py + cbsigma + nfmdnp3, master and outstation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          docker pull "$DNP3_INTEROP_OPENDNP3_IMAGE"
          docker pull "$DNP3_INTEROP_DSCSYSTEMS_IMAGE"
          docker pull "$DNP3_INTEROP_DNP3PY_IMAGE"
          docker pull "$DNP3_INTEROP_CBSIGMA_IMAGE"
          docker pull "$DNP3_INTEROP_NFMDNP3_IMAGE"

      - name: Interop tests
        run: make test-interop
