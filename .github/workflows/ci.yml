name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-dnp3
      # Coverage across the library packages, as make check measures it:
      # the e2e suite and the client and server tests exercise each other's
      # packages. make coverpkg-check keeps it equal to COVER_PKGS.
      coverpkg: >-
        github.com/otfabric/go-dnp3,github.com/otfabric/go-dnp3/app,github.com/otfabric/go-dnp3/client,github.com/otfabric/go-dnp3/internal/channel,github.com/otfabric/go-dnp3/internal/logx,github.com/otfabric/go-dnp3/link,github.com/otfabric/go-dnp3/secauth,github.com/otfabric/go-dnp3/server,github.com/otfabric/go-dnp3/transport
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit

  # The generated table, Measurements' points and OBJECTS.md follow
  # app/catalog.json: a change of either without the other fails.
  generate:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make generate-check

  # The self-contained examples must keep running as they are.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make build examples

  # The codec and outstation fuzz targets, briefly, on every push.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - run: make fuzz FUZZTIME=20s
      # The input a failing target wrote, to reproduce it with
      # go test -run=<target>/<file> after copying it into testdata.
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: warn
